version: 2
updates:
  # The actions are pinned by commit; this keeps the pins (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Cargo.lock only: the version requirements in the manifests are bevel's public contract,
  # widened by hand. egui moves in step across egui, epaint, egui_kittest and eframe.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    groups:
      egui:
        patterns: ["egui*", "epaint*", "eframe", "emath", "ecolor"]
      icu4x:
        patterns: ["icu_*", "fixed_decimal", "writeable"]
      others:
        patterns: ["*"]
