name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: catches new lints and regressions on beta and nightly, and new releases of
  # dependencies, with nothing pushed.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Packages that are never published: left out of packaging and docs.
  UNPUBLISHED: --exclude bevel-fonts-build-consumer --exclude bevel-examples

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt && rustup default stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The crates have code per platform: Wayland probing (Linux), AppKit (macOS),
        # the registry (Windows).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features --locked

  # Each feature alone, on top of no default features: catches code that only builds
  # because another feature happens to be on.
  features:
    name: Features, one at a time
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy && rustup default stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # No --locked: --no-dev-deps drops the dev-dependencies, so the lockfile shrinks.
      - run: cargo hack clippy --workspace --each-feature --no-dev-deps

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The rendering tests (egui_kittest on wgpu) need a GPU adapter: Mesa's software
      # Vulkan driver (lavapipe) stands in for one on the runner.
      - name: Install a software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Linux runs every test. macOS and Windows run the library tests: the rendering
      # tests depend on a GPU adapter those runners do not reliably offer.
      # The RTL snapshot test is left to the `snapshots` job (see there).
      - name: Tests (all)
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --locked -- --skip testing_rename_dialog_snapshots
      - name: Tests (libraries)
        if: runner.os != 'Linux'
        run: cargo test --workspace --all-features --locked --lib --no-fail-fast

  # The Arabic snapshot was recorded with the craft-libs egui fork, whose bidi layout stock
  # egui does not have yet: it fails until the snapshot or the layout is updated. Kept
  # visible, but not blocking; the diff images are attached to the run.
  snapshots:
    name: Screen snapshots (known failure, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test -p bevel-widgets --features screen-testing --test screens --locked
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs
          path: bevel-widgets/tests/snapshots/*.png
          retention-days: 14

  # The web build: bevel-widgets fetches its fonts there, bevel-i18n reads the browser's locale.
  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --target wasm32-unknown-unknown -p bevel-i18n -p bevel-widgets -p bevel-theme -p bevel-window --all-features --locked

  # The `rust-version` the manifests declare (workspace.package), read from Cargo.toml so a
  # bump is made in one place. Libraries only: dev-dependencies may need a newer toolchain.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Rust (MSRV)
        env:
          TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update && rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-features --locked

  # The lowest versions the manifests allow for bevel's own dependencies: a dependency whose
  # requirement is older than the API the code uses fails here, not in a user's build.
  # Dev-dependencies are removed first: they are not part of what a user resolves, and the
  # test stack (egui_kittest, eframe) would otherwise pull the minimums up.
  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (nightly)
        run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-hack
      - name: Remove the dev-dependencies
        run: cargo hack --remove-dev-deps --workspace
      - name: Resolve the direct dependencies to their lowest versions
        run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo check --workspace --all-features

  # Beta warns of breakage six weeks ahead; nightly is informational.
  toolchains:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (matrix)
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update && rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --locked --lib

  # What `cargo publish` will do on a release tag, minus the upload: every crate packaged,
  # then built from its package against the others' packages.
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --workspace --dry-run --locked $UNPUBLISHED

  # API changes against the last release on crates.io: a breaking change needs a major
  # (0.x: minor) bump. Skipped until the crates are on crates.io.
  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is bevel on crates.io yet?
        id: published
        run: |
          if curl -sSf -o /dev/null -A "bevel-ci (https://github.com/julien-langlois/bevel)" https://crates.io/api/v1/crates/bevel-widgets; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not published yet: nothing to compare against."
          fi
      - if: steps.published.outputs.yes == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          exclude: bevel-fonts-build-consumer
