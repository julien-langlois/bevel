[package]
name = "bevel-theme"
description = "Design tokens (surfaces, text, accent, status tones, radii, spacing) in dark and light for egui, applied to a context in one call."
version.workspace = true
include = ["src/**", "fonts/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
edition.workspace = true
# The embedded Inter and JetBrains Mono faces (fonts/, feature `fonts`) are under the SIL OFL 1.1.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
readme = "README.md"
keywords = ["egui", "theme", "design-tokens", "dark-mode", "gui"]
categories = ["gui"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["widgets"]
# Adapters from the tokens to bevel-widgets styles (icon buttons, widget palettes).
widgets = ["dep:bevel-widgets"]
# Inter and JetBrains Mono (SIL OFL 1.1), embedded: about 1.5 MB.
fonts = []

[dependencies]
egui = { workspace = true }
bevel-widgets = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
# Marks each item with the feature it needs (`#![cfg_attr(docsrs, feature(doc_cfg))]`).
rustdoc-args = ["--cfg", "docsrs"]

# cargo-release (declared on this package only, so it runs once per release): prepends the
# release's section to CHANGELOG.md with cliff.toml, the same config as the GitHub release notes
# (.github/workflows/release.yml). During a dry run (DRY_RUN=true) it only prints the section.
[package.metadata.release]
pre-release-hook = [
  "sh",
  "-c",
  'cd "$WORKSPACE_ROOT" && if [ "$DRY_RUN" = true ]; then git cliff --unreleased --tag "v$NEW_VERSION" --strip header; else git cliff --unreleased --tag "v$NEW_VERSION" --prepend CHANGELOG.md; fi',
]
